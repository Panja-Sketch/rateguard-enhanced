steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_RATEGUARD_API_URL=${_NEXT_PUBLIC_RATEGUARD_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/rateguard-images/rateguard-web:${_IMAGE_TAG}'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/rateguard-images/rateguard-web:${_IMAGE_TAG}'
substitutions:
  _NEXT_PUBLIC_RATEGUARD_API_URL: 'http://localhost:8000'
  # Public Firebase web config (not secrets); supplied by the deploy script.
  _NEXT_PUBLIC_FIREBASE_API_KEY: ''
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ''
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ''
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ''
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ''
  _NEXT_PUBLIC_FIREBASE_APP_ID: ''
  _NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ''
  # Default preserves the existing production build behavior exactly (no
  # deploy script other than a candidate deploy passes _IMAGE_TAG). A
  # candidate/staging build passes an immutable tag derived from the git
  # commit SHA instead -- see infrastructure/deploy_candidate_enhanced.sh.
  #
  # _NEXT_PUBLIC_RATEGUARD_API_URL is a `next dev` / no-runtime-config
  # fallback ONLY. The actual API base URL a deployed image calls is chosen
  # at deploy time, not build time: RATEGUARD_API_URL (a plain Cloud Run env
  # var, deliberately NOT NEXT_PUBLIC_*, so it is never baked into client
  # JS) is read per-request by the root layout and injected as
  # window.__RATEGUARD_RUNTIME_CONFIG__ -- see
  # frontend/src/lib/runtimeConfig.ts. This is what lets the exact same web
  # image digest be deployed unchanged as both the candidate (candidate API
  # URL) and the production release (stable production API URL) -- see
  # infrastructure/promote_candidate_to_production.sh.
  _IMAGE_TAG: 'latest'
