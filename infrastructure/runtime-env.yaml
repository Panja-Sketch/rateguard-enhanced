RATEGUARD_GOOGLE_CLOUD_PROJECT: "rateguard-ai"
RATEGUARD_GOOGLE_CLOUD_REGION: "us-central1"
RATEGUARD_GCS_BUCKET: "rateguard-ai-artifacts"
# "(default)" is a valid Firestore database id. The historical
# "400 Invalid database id %28default%29" incident was a google-api-core==2.35.0
# percent-encoding regression, NOT an invalid value here — the real fix is the
# google-api-core==2.34.0 pin in backend/pyproject.toml. This value stays as-is;
# app/storage/firestore_store.py additionally normalizes it defensively.
RATEGUARD_FIRESTORE_DATABASE: "(default)"
RATEGUARD_RUN_STORE: "firestore"
RATEGUARD_ARTIFACT_STORE: "gcs"
RATEGUARD_BIGQUERY_ENABLED: "true"
RATEGUARD_BIGQUERY_DATASET: "rateguard"
RATEGUARD_BIGQUERY_PORTFOLIO_TABLE: "synthetic_policies"
RATEGUARD_BIGQUERY_RESULTS_TABLE: "portfolio_exposure_results"
RATEGUARD_ASYNC_ENABLED: "true"
RATEGUARD_EXECUTION_MODE: "pubsub"
RATEGUARD_PUBSUB_TOPIC: "assurance-runs"
RATEGUARD_PUBSUB_SUBSCRIPTION: "assurance-worker"
RATEGUARD_GEMINI_MODEL: "gemini-3.7-flash"
RATEGUARD_DATA_DIR: "/app/data"
RATEGUARD_CORS_ORIGINS: '["http://localhost:3000","https://rateguard-web-iqofutwtva-uc.a.run.app"]'
# Gemini runtime configuration (non-secret). Cloud Run authenticates to
# Vertex AI as rateguard-runtime@rateguard-ai.iam.gserviceaccount.com, which
# already holds roles/aiplatform.user — no API key is configured or needed;
# see GeminiDecisionClient._resolve_auth_mode (Vertex AI ADC takes precedence
# over an API key, and API_KEY mode simply isn't configured here).
RATEGUARD_AGENT_ENABLED: "true"
GOOGLE_GENAI_USE_VERTEXAI: "true"
GOOGLE_CLOUD_PROJECT: "rateguard-ai"
GOOGLE_CLOUD_LOCATION: "global"
